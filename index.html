<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%}
body{font-family:'DM Sans',sans-serif;background:#0D0F18;color:#EEE9FF;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A2D40;border-radius:4px}

/* AUTH */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0D0F18 0%,#13151F 100%);padding:20px}
.auth-box{background:#13151F;border:1px solid #2A2D40;border-radius:28px;padding:40px;width:100%;max-width:440px;box-shadow:0 40px 100px rgba(0,0,0,.5)}
.auth-logo{font-family:‘Fraunces’,serif;font-size:30px;font-weight:600;text-align:center;margin-bottom:8px}
.auth-logo span{color:#FF6B4A}
.auth-sub{text-align:center;color:#7B7F9E;font-size:14px;margin-bottom:32px}
.auth-tabs{display:flex;gap:0;margin-bottom:28px;background:#1C1F2E;border-radius:14px;padding:4px}
.auth-tab{flex:1;padding:10px;border:none;background:transparent;color:#7B7F9E;font-weight:600;font-size:14px;cursor:pointer;border-radius:10px;transition:all .2s;font-family:inherit}
.auth-tab.active{background:#252838;color:#EEE9FF}
.role-pick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
.role-btn{padding:18px 14px;border:1.5px solid #2A2D40;border-radius:16px;background:transparent;color:#EEE9FF;cursor:pointer;text-align:center;transition:all .2s;font-family:inherit}
.role-btn:hover{border-color:#FF6B4A}
.role-btn.sel{border-color:#FF6B4A;background:rgba(255,107,74,.08)}
.role-icon{font-size:28px;display:block;margin-bottom:6px}
.role-label{font-weight:700;font-size:14px;display:block}
.role-desc{font-size:11px;color:#7B7F9E;margin-top:2px;display:block}
.inp{width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:12px;padding:12px 16px;color:#EEE9FF;font-size:14px;font-family:inherit;outline:none;transition:border .2s;margin-bottom:14px}
.inp:focus{border-color:#FF6B4A}
.inp::placeholder{color:#4A4D60}
.auth-btn{width:100%;background:linear-gradient(135deg,#FF6B4A,#E05535);color:white;border:none;padding:14px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px;transition:opacity .2s}
.auth-btn:hover{opacity:.88}
.auth-btn:disabled{opacity:.5;cursor:not-allowed}
.auth-err{color:#FF6B4A;font-size:13px;text-align:center;margin-top:10px}

/* APP LAYOUT */
.app{display:flex;height:100vh}
.sidebar{width:240px;background:#13151F;border-right:1px solid #2A2D40;display:flex;flex-direction:column;padding:22px 12px;flex-shrink:0;overflow-y:auto}
.s-logo{font-family:‘Fraunces’,serif;font-size:24px;font-weight:600;padding-left:10px;margin-bottom:8px}
.s-logo span{color:#FF6B4A}
.s-role-badge{font-size:10px;font-weight:700;letter-spacing:1px;padding-left:10px;margin-bottom:20px}
.s-nav{flex:1;display:flex;flex-direction:column;gap:2px}
.s-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:#7B7F9E;transition:all .2s;border-left:3px solid transparent}
.s-item:hover{background:#1C1F2E}
.s-item.act{background:#1C1F2E;color:#EEE9FF;border-left-color:#F0C060}
.s-badge{margin-left:auto;background:#FF6B4A;color:white;border-radius:20px;font-size:10px;font-weight:800;padding:1px 7px}
.s-user{border-top:1px solid #2A2D40;padding-top:14px;display:flex;align-items:center;gap:10px;padding-left:6px}
.s-avatar{width:36px;height:36px;border-radius:50%;background:#252838;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#F0C060;flex-shrink:0}
.s-uname{font-size:13px;font-weight:700}
.s-urole{font-size:11px;color:#7B7F9E}
.s-logout{background:none;border:none;color:#7B7F9E;cursor:pointer;font-size:11px;padding:2px 0;font-family:inherit}
.s-logout:hover{color:#FF6B4A}

.main{flex:1;overflow-y:auto;padding:32px 36px}
.page-title{font-family:‘Fraunces’,serif;font-size:28px;font-weight:300;letter-spacing:-1px;margin-bottom:6px}
.page-sub{color:#7B7F9E;font-size:13px;margin-bottom:28px}

/* CARDS */
.card{background:#13151F;border:1px solid #2A2D40;border-radius:20px;padding:24px}
.card-sm{background:#13151F;border:1px solid #2A2D40;border-radius:16px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}

/* STAT CARDS */
.stat-val{font-family:‘Fraunces’,serif;font-size:28px;font-weight:700;margin-top:10px}
.stat-lbl{font-size:12px;color:#7B7F9E;margin-top:4px}

/* BUTTONS */
.btn{padding:10px 20px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn-primary{background:#FF6B4A;color:white}
.btn-primary:hover{opacity:.85;transform:translateY(-1px)}
.btn-gold{background:linear-gradient(135deg,#F0C060,#C8852A);color:#1A1000}
.btn-outline{background:transparent;color:#EEE9FF;border:1.5px solid #2A2D40}
.btn-outline:hover{border-color:#7B7F9E}
.btn-green{background:rgba(61,214,140,.15);color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:10px}
.btn-full{width:100%;padding:13px;border-radius:14px;font-size:14px}

/* STATUS */
.status{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
.status-pending{background:#2A1F08;color:#F0C060;border:1px solid rgba(240,192,96,.3)}
.status-confirmed{background:#0D2A1A;color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.status-done{background:#1A1A1A;color:#555;border:1px solid #333}
.status-cancelled{background:#2A0D0D;color:#FF6B4A;border:1px solid rgba(255,107,74,.3)}

.sitter-card.premium{border-color:rgba(240,192,96,.3);box-shadow:0 0 0 1px rgba(240,192,96,.2)}
.avatar{width:52px;height:52px;border-radius:50%;background:#1C1F2E;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#F0C060;flex-shrink:0}
.avatar-lg{width:72px;height:72px;font-size:30px}
.tag{background:rgba(255,255,255,.06);color:#7B7F9E;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.tag-gold{background:rgba(240,192,96,.12);color:#F0C060;border:1px solid rgba(240,192,96,.25)}
.stars{color:#F0C060;font-size:13px;letter-spacing:1px}

/* CHAT */
.chat-wrap{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 120px);background:#13151F;border-radius:22px;border:1px solid #2A2D40;overflow:hidden}
.chat-list{border-right:1px solid #2A2D40;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:background .15s}
.chat-item:hover{background:#1C1F2E}
.chat-item.sel{background:#252838}
.chat-msgs{flex:1;display:flex;flex-direction:column}
.chat-header{padding:16px 22px;border-bottom:1px solid #2A2D40;display:flex;align-items:center;gap:12px}
.msgs-area{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;justify-content:flex-start;gap:10px;align-items:flex-end}
.msg.mine{justify-content:flex-end}
.msg-bubble{max-width:60%;padding:11px 15px;border-radius:18px;font-size:14px;line-height:1.6}
.msg-bubble.them{background:#1C1F2E;border-radius:18px 18px 18px 4px}
.msg-bubble.mine{background:linear-gradient(135deg,#FF6B4A,#E05535);border-radius:18px 18px 4px 18px}
.msg-time{font-size:10px;color:#4A4D60;margin-top:3px}
.chat-input{padding:14px 20px;border-top:1px solid #2A2D40;display:flex;gap:10px}
.chat-inp{flex:1;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:14px;padding:11px 16px;color:#EEE9FF;font-size:14px;font-family:inherit;outline:none}
.chat-inp:focus{border-color:#FF6B4A}

/* FORM */
.form-group{margin-bottom:18px}
.form-label{font-size:11px;font-weight:700;color:#7B7F9E;letter-spacing:.8px;display:block;margin-bottom:7px;text-transform:uppercase}
.form-inp{width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:12px;padding:12px 16px;color:#EEE9FF;font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.form-inp:focus{border-color:#FF6B4A}
.form-inp::placeholder{color:#4A4D60}
textarea.form-inp{resize:vertical;min-height:90px}
select.form-inp option{background:#1C1F2E}

/* TRACKING */
.track-map{background:#070E08;border-radius:22px;border:1px solid #1D4A30;overflow:hidden;position:relative;height:420px}
.track-info{display:flex;flex-direction:column;gap:12px}
.tinfo-card{background:#13151F;border-radius:14px;padding:14px 16px;border:1px solid #2A2D40;display:flex;align-items:center;gap:12px}

/* MISC */
.divider{height:1px;background:#2A2D40;margin:20px 0}
.empty{text-align:center;padding:48px 20px;color:#7B7F9E;font-size:14px}
.empty-icon{font-size:40px;display:block;margin-bottom:12px}
.premium-badge{background:linear-gradient(135deg,#F0C060,#C8852A);color:#1A1000;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px;letter-spacing:.5px}
.online-dot{width:8px;height:8px;border-radius:50%;background:#3DD68C;display:inline-block}
.pulse{animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.ping{animation:ping 1.3s cubic-bezier(0,0,.2,1) infinite}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .3s ease forwards}
.loading{text-align:center;padding:40px;color:#7B7F9E}

@media(max-width:768px){
.sidebar{width:60px;padding:16px 8px}
.s-logo,.s-role-badge,.s-item span,.s-uname,.s-urole,.s-logout{display:none}
.s-item{padding:12px;justify-content:center}
.main{padding:20px 16px}
.grid2,.grid3,.grid4{grid-template-columns:1fr}
.chat-wrap{grid-template-columns:1fr}
.chat-list{display:none}
.hero-cards{display:none}
}
</style>

</head>

function AuthScreen({onAuth}) {
const [mode, setMode] = useState(‘login’);
const [role, setRole] = useState(’’);
const [email, setEmail] = useState(’’);
const [password, setPassword] = useState(’’);
const [name, setName] = useState(’’);
const [loading, setLoading] = useState(false);
const [err, setErr] = useState(’’);

async function handleSubmit() {
setErr(’’); setLoading(true);
try {
if (mode === ‘login’) {
const {data,error} = await sb.auth.signInWithPassword({email,password});
if (error) throw error;
const {data:profile} = await sb.from(‘profiles’).select(’*’).eq(‘user_id’,data.user.id).single();
onAuth(data.user, profile);
} else {
if (!role) { setErr(‘Choisissez votre rôle’); setLoading(false); return; }
if (!name) { setErr(‘Entrez votre prénom’); setLoading(false); return; }
const {data,error} = await sb.auth.signUp({email,password});
if (error) throw error;
await sb.from(‘profiles’).insert({user_id:data.user.id,role,name,location:‘Belgique’});
const {data:profile} = await sb.from(‘profiles’).select(’*’).eq(‘user_id’,data.user.id).single();
onAuth(data.user, profile);
}
} catch(e) {
setErr(e.message === ‘Invalid login credentials’ ? ‘Email ou mot de passe incorrect’ : e.message);
}
setLoading(false);
}

return (

function OwnerApp({user, profile, onLogout}) {
const [tab, setTab] = useState(‘dashboard’);
const [selSitter, setSelSitter] = useState(null);
const [reservations, setReservations] = useState([]);
const [unread, setUnread] = useState(2);

useEffect(()=>{loadReservations();},[]);

async function loadReservations() {

setReservations(data || []);

function SitterDetail({sitter, back, profile, onBooked, setTab}) {
const [start, setStart] = useState(’’);
const [end, setEnd] = useState(’’);
const [type, setType] = useState(‘Garde à domicile’);
const [dog, setDog] = useState(’’);
const [notes, setNotes] = useState(’’);
const [loading, setLoading] = useState(false);
const [success, setSuccess] = useState(false);

async function book() {
if (!start||!end||!dog) return;
setLoading(true);
const days = Math.max(1, Math.ceil((new Date(end)-new Date(start))/(1000*60*60*24)));
const price = sitter.price * days;
await sb.from(‘reservations’).insert({
sitter_id: sitter.id,
owner_id: profile?.id,
sitter_name: sitter.name,
dog_name: dog,
start_date: start,
end_date: end,
type,
notes,
price,
status: ‘pending’
});
setSuccess(true);
setLoading(false);
onBooked();
setTimeout(()=>{setSuccess(false);setTab(‘reservations’);},2000);
}

return (
<div>
<button onClick={back} style={{background:‘none’,border:‘none’,cursor:‘pointer’,color:’#7B7F9E’,fontSize:14,marginBottom:22,display:‘flex’,alignItems:‘center’,gap:6}}>← Retour</button>

{sitter.premium&&<span className="premium-badge">✦ PREMIUM</span>}

</div>
</div>
</div>
<p style={{color:’#AAA’,lineHeight:1.8,marginBottom:18}}>{sitter.bio}</p>

function SitterApp({user, profile, onLogout}) {

const {data} = await sb.from(‘reservations’).select(’*’).eq(‘sitter_id’, profile?.id).order(‘created_at’,{ascending:false});

await sb.from(‘reservations’).update({status}).eq(‘id’,id);

)}

<button className=“btn btn-sm” style={{background:‘rgba(61,214,140,.12)’,color:’#3DD68C’,border:‘1px solid rgba(61,214,140,.3)’}} onClick={()=>onUpdateStatus(r.id,‘done’)}>
✓ Terminé
</button>
)}
</div>
))}
</div>
)}
</div>
);
}

function SitterProfile({user, profile: initProfile}) {
const [profile, setProfile] = useState(initProfile||{});
const [saving, setSaving] = useState(false);
const [saved, setSaved] = useState(false);

async function save() {
setSaving(true);
await sb.from(‘profiles’).update({
name: profile.name,
bio: profile.bio,
location: profile.location,
price: profile.price,
available: profile.available,
}).eq(‘user_id’, user.id);
setSaving(false); setSaved(true);
setTimeout(()=>setSaved(false),2000);
}

return (
<div>
<div className="page-title">Mon profil</div>
<div className="page-sub">Ces informations sont visibles par les propriétaires</div>
<div className=“grid2” style={{alignItems:‘start’}}>
<div className="card">
<div style={{fontWeight:700,marginBottom:22}}>Informations</div>
{[
{label:‘Prénom’,key:‘name’,placeholder:‘Votre prénom’},
{label:‘Localisation’,key:‘location’,placeholder:‘Ex: Liège, Namur…’},
].map(f=>(
<div key={f.key} className="form-group">
<label className="form-label">{f.label}</label>
<input className=“form-inp” placeholder={f.placeholder} value={profile[f.key]||’’} onChange={e=>setProfile({…profile,[f.key]:e.target.value})}/>
</div>
))}
<div className="form-group">
<label className="form-label">Tarif journalier (€)</label>
<input type=“number” className=“form-inp” value={profile.price||25} onChange={e=>setProfile({…profile,price:e.target.value})}/>
</div>
<div className="form-group">
<label className="form-label">Bio</label>
<textarea className=“form-inp” placeholder=“Décrivez-vous, votre expérience avec les animaux…” value={profile.bio||’’} onChange={e=>setProfile({…profile,bio:e.target.value})}/>
</div>
<div className="form-group">
<label className="form-label">Disponibilité</label>
<div style={{display:‘flex’,gap:12}}>
<button className={`btn btn-sm${profile.available?' btn-green':' btn-outline'}`} onClick={()=>setProfile({…profile,available:true})}>● Disponible</button>
<button className={`btn btn-sm${!profile.available?' btn-primary':' btn-outline'}`} onClick={()=>setProfile({…profile,available:false})}>Occupé</button>
</div>
</div>
<button className="btn btn-primary btn-full" onClick={save} disabled={saving}>
{saving?‘Sauvegarde…’:saved?‘✓ Sauvegardé !’:‘Sauvegarder’}
</button>
</div>
<div className="card">
<div style={{fontWeight:700,marginBottom:18}}>Aperçu de votre profil</div>
<div style={{display:‘flex’,gap:14,alignItems:‘center’,marginBottom:14}}>
<Avatar name={profile.name} size="lg"/>
<div>
<div style={{fontWeight:700,fontSize:16}}>{profile.name||‘Votre nom’}</div>
<div style={{color:’#7B7F9E’,fontSize:13}}>📍 {profile.location||‘Belgique’}</div>
<Stars n={5}/>
</div>
</div>
<p style={{color:’#7B7F9E’,fontSize:13,lineHeight:1.7,marginBottom:14}}>{profile.bio||‘Votre bio apparaîtra ici…’}</p>
<div style={{display:‘flex’,justifyContent:‘space-between’,borderTop:‘1px solid #2A2D40’,paddingTop:14}}>
<span style={{color:’#7B7F9E’,fontSize:13}}>Tarif journalier</span>
<span style={{fontWeight:800,fontSize:18}}>{profile.price||25}€</span>
</div>
</div>
</div>
</div>
);
}

function Messages({profile, onRead}) {

if (!input.trim()) return;
setMsgs([…msgs,{id:msgs.length+1,text:input,mine:true,time:‘Maintenant’}]);

// ══════════════════════════════════════════════
// MAIN APP
// ══════════════════════════════════════════════
function App() {
const [user, setUser] = useState(null);
const [profile, setProfile] = useState(null);
const [loading, setLoading] = useState(true);

useEffect(()=>{
sb.auth.getSession().then(({data:{session}})=>{
if (session?.user) {
setUser(session.user);
sb.from(‘profiles’).select(’*’).eq(‘user_id’,session.user.id).single()
.then(({data})=>{ setProfile(data); setLoading(false); });
} else setLoading(false);
});
const {data:{subscription}} = sb.auth.onAuthStateChange((_,session)=>{
if (!session) { setUser(null); setProfile(null); }
});
return ()=>subscription.unsubscribe();
},[]);

async function handleLogout() {
await sb.auth.signOut();
setUser(null); setProfile(null);
}

if (loading) return (
<div style={{display:‘flex’,alignItems:‘center’,justifyContent:‘center’,height:‘100vh’,background:’#0D0F18’}}>
<div style={{textAlign:‘center’}}>
<div style={{fontFamily:‘Fraunces,serif’,fontSize:32,fontWeight:600,marginBottom:12}}>Dog<span style={{color:’#FF6B4A’}}>Link</span></div>
<div style={{color:’#7B7F9E’,fontSize:14}}>Chargement…</div>
</div>
</div>
);

if (!user || !profile) return <AuthScreen onAuth={(u,p)=>{setUser(u);setProfile(p);}}/>;
if (profile?.role===‘sitter’) return <SitterApp user={user} profile={profile} onLogout={handleLogout}/>;
return <OwnerApp user={user} profile={profile} onLogout={handleLogout}/>;
}

ReactDOM.createRoot(document.getElementById(‘root’)).render(<App/>);
</script>
