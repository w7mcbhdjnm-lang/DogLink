<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DogLink</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0D0F18;color:#EEE9FF;overflow-x:hidden}
button{cursor:pointer;font-family:inherit;border:none;-webkit-appearance:none;touch-action:manipulation}
input,select,textarea{font-family:inherit;-webkit-appearance:none}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A2D40;border-radius:4px}

/* ── AUTH ── */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;background:#0D0F18}
.abox{background:#13151F;border:1px solid #2A2D40;border-radius:24px;padding:36px 32px;width:100%;max-width:400px}
.alogo{font-family:‘Fraunces’,serif;font-size:28px;font-weight:600;text-align:center;margin-bottom:6px}
.alogo span{color:#FF6B4A}
.asub{text-align:center;color:#7B7F9E;font-size:13px;margin-bottom:24px}
.atabs{display:flex;background:#1C1F2E;border-radius:12px;padding:4px;margin-bottom:22px;gap:4px}
.atab{flex:1;padding:10px 8px;background:transparent;color:#7B7F9E;font-weight:600;font-size:14px;border-radius:9px;border:none;transition:all .2s;touch-action:manipulation;-webkit-appearance:none;cursor:pointer}
.atab.on{background:#252838;color:#EEE9FF}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.rbtn{padding:16px 10px;border:1.5px solid #2A2D40;border-radius:14px;background:transparent;color:#EEE9FF;text-align:center;touch-action:manipulation;-webkit-appearance:none;cursor:pointer;transition:all .2s;border:1.5px solid #2A2D40}
.rbtn.on{border-color:#FF6B4A;background:rgba(255,107,74,.1)}
.rico{font-size:26px;display:block;margin-bottom:5px}
.rlbl{font-weight:700;font-size:13px;display:block}
.rdsc{font-size:11px;color:#7B7F9E;margin-top:2px;display:block}
.ainp{width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:11px;padding:12px 14px;color:#EEE9FF;font-size:14px;outline:none;margin-bottom:11px;-webkit-appearance:none}
.ainp:focus{border-color:#FF6B4A}
.asbtn{width:100%;background:linear-gradient(135deg,#FF6B4A,#E05535);color:white;padding:14px;border-radius:13px;font-weight:700;font-size:15px;margin-top:4px;touch-action:manipulation;-webkit-appearance:none;cursor:pointer;border:none}
.aerr{color:#FF6B4A;font-size:13px;text-align:center;margin-top:10px;min-height:20px}

/* ── APP ── */
#app{position:fixed;inset:0;display:none;flex-direction:row}
.sb{width:230px;background:#13151F;border-right:1px solid #2A2D40;display:flex;flex-direction:column;padding:20px 10px;flex-shrink:0;overflow-y:auto}
.sblogo{font-family:‘Fraunces’,serif;font-size:22px;font-weight:600;padding-left:10px;margin-bottom:3px}
.sblogo span{color:#FF6B4A}
.sbrole{font-size:10px;font-weight:700;letter-spacing:1px;padding-left:10px;margin-bottom:18px}
.sbnav{flex:1;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600;color:#7B7F9E;border-left:3px solid transparent;touch-action:manipulation}
.ni:hover,.ni.on{background:#1C1F2E;color:#EEE9FF;border-left-color:#F0C060}
.nbadge{margin-left:auto;background:#FF6B4A;color:white;border-radius:20px;font-size:10px;font-weight:800;padding:1px 6px}
.sbu{border-top:1px solid #2A2D40;padding-top:12px;display:flex;align-items:center;gap:9px;padding-left:6px;margin-top:auto}
.av{width:36px;height:36px;border-radius:50%;background:#252838;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#F0C060;flex-shrink:0}
.avlg{width:60px;height:60px;font-size:22px}
.sbun{font-size:13px;font-weight:700}
.sbur{font-size:11px;color:#7B7F9E}
.lbtn{background:none;border:none;color:#7B7F9E;cursor:pointer;font-size:11px;font-family:inherit;touch-action:manipulation;padding:2px 0}
.main{flex:1;overflow-y:auto;padding:28px 32px}

/* ── COMPONENTS ── */
.ptitle{font-family:‘Fraunces’,serif;font-size:24px;font-weight:300;letter-spacing:-1px;margin-bottom:3px}
.psub{color:#7B7F9E;font-size:12px;margin-bottom:22px}
.card{background:#13151F;border:1px solid #2A2D40;border-radius:18px;padding:20px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sv{font-family:‘Fraunces’,serif;font-size:24px;font-weight:700;margin-top:8px}
.sl{font-size:11px;color:#7B7F9E;margin-top:3px}
.btn{padding:8px 16px;border-radius:11px;font-weight:700;font-size:12px;cursor:pointer;border:none;font-family:inherit;touch-action:manipulation;-webkit-appearance:none}
.bp{background:#FF6B4A;color:white}
.bo{background:transparent;color:#EEE9FF;border:1.5px solid #2A2D40}
.bg{background:rgba(61,214,140,.15);color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.bsm{padding:6px 12px;font-size:11px;border-radius:9px}
.bfull{width:100%;padding:12px;font-size:13px;border-radius:13px;margin-bottom:9px}
.st{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
.stp{background:#2A1F08;color:#F0C060;border:1px solid rgba(240,192,96,.3)}
.stc{background:#0D2A1A;color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.std{background:#1A1A1A;color:#555;border:1px solid #333}
.fl{font-size:11px;font-weight:700;color:#7B7F9E;letter-spacing:.8px;display:block;margin-bottom:5px;text-transform:uppercase}
.fi{width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:11px;padding:10px 13px;color:#EEE9FF;font-size:13px;font-family:inherit;outline:none;margin-bottom:12px;-webkit-appearance:none}
.fi:focus{border-color:#FF6B4A}
textarea.fi{resize:vertical;min-height:75px}
.tag{background:rgba(255,255,255,.06);color:#7B7F9E;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px}
.pbadge{background:linear-gradient(135deg,#F0C060,#C8852A);color:#1A1000;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px}
.stars{color:#F0C060;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#3DD68C;display:inline-block}
.cw{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - 100px);background:#13151F;border-radius:18px;border:1px solid #2A2D40;overflow:hidden}
.cl{border-right:1px solid #2A2D40;overflow-y:auto}
.ci{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;touch-action:manipulation}
.ci.on{background:#252838}
.cb{display:flex;flex-direction:column;height:100%}
.ch{padding:13px 18px;border-bottom:1px solid #2A2D40;display:flex;align-items:center;gap:10px}
.ms{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.mg{display:flex;align-items:flex-end;gap:8px}
.mg.me{justify-content:flex-end}
.mb{max-width:60%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.6}
.mb.th{background:#1C1F2E;border-radius:16px 16px 16px 3px}
.mb.me{background:linear-gradient(135deg,#FF6B4A,#E05535);border-radius:16px 16px 3px 16px}
.mt{font-size:10px;color:#4A4D60;margin-top:2px}
.cf{padding:12px 16px;border-top:1px solid #2A2D40;display:flex;gap:8px}
.ci2{flex:1;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:13px;padding:9px 13px;color:#EEE9FF;font-size:13px;font-family:inherit;outline:none;-webkit-appearance:none}
.ci2:focus{border-color:#FF6B4A}
.tm{background:#070E08;border-radius:18px;border:1px solid #1D4A30;position:relative;height:380px;overflow:hidden}
.sc{display:flex;flex-direction:column;gap:10px}
.ic{background:#13151F;border-radius:13px;padding:12px 14px;border:1px solid #2A2D40;display:flex;align-items:center;gap:10px}
.empty{text-align:center;padding:36px;color:#7B7F9E;font-size:13px}
.ei{font-size:34px;display:block;margin-bottom:9px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.pulse{animation:pulse 2s infinite}
.ping{animation:ping 1.3s cubic-bezier(0,0,.2,1) infinite}
@media(max-width:680px){
.sb{width:50px;padding:12px 6px}
.sblogo,.sbrole,.ni span:not(:first-child),.sbun,.sbur,.lbtn{display:none}
.ni{padding:10px;justify-content:center}
.main{padding:16px 12px}
.g2,.g3,.g4{grid-template-columns:1fr}
.cw{grid-template-columns:1fr}.cl{display:none}
}
</style>

</head>
<body>

<!-- AUTH -->

<div id="auth">
  <div class="abox">
    <div class="alogo">Dog<span>Link</span></div>
    <div class="asub">Petsitting Belgique</div>
    <div class="atabs">
      <button class="atab on" id="tl">Se connecter</button>
      <button class="atab" id="tr">S'inscrire</button>
    </div>
    <div id="rfields" style="display:none">
      <div class="roles">
        <button class="rbtn" id="ro">
          <span class="rico">🐕</span>
          <span class="rlbl">Propriétaire</span>
          <span class="rdsc">Je cherche un petsitter</span>
        </button>

          <span class="rico">
            <svg width="30" height="30" viewBox="0 0 60 60" fill="none">

              <ellipse cx="42" cy="37" rx="8" ry="5" fill="#EEE9FF" transform="rotate(-8 42 37)"/>
              <circle cx="48" cy="32" r="4.5" fill="#EEE9FF"/>
              <path d="M46 28 Q44 24 47 23" stroke="#EEE9FF" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M50 28 Q52 24 50 23" stroke="#EEE9FF" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M36 40 L34 48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <path d="M41 42 L40 48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <path d="M46 42 L46 48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <path d="M51 41 L52 48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <path d="M35 36 Q30 30 33 26" stroke="#EEE9FF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
            </svg>
          </span>
          <span class="rlbl">Petsitteur</span>
          <span class="rdsc">Je garde des chiens</span>
        </button>
      </div>
      <input class="ainp" id="aname" placeholder="Votre prénom">
    </div>
    <input class="ainp" id="aemail" type="email" placeholder="Email" autocomplete="email">
    <input class="ainp" id="apass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="asbtn" id="asubmit">Se connecter →</button>
    <div class="aerr" id="aerr"></div>
  </div>
</div>

<!-- APP -->

<div id="app">
  <aside class="sb">
    <div class="sblogo">Dog<span>Link</span></div>
    <div class="sbrole" id="rlabel"></div>
    <nav class="sbnav" id="snav"></nav>
    <div class="sbu">
      <div class="av" id="uav">?</div>
      <div>
        <div class="sbun" id="uname">Utilisateur</div>
        <div class="sbur" id="urole"></div>
        <button class="lbtn" id="lout">Déconnexion</button>
      </div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
var SB_URL='https://mxvzgngtgjovrzfktfhw.supabase.co';
var SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14dnpnbmd0Z2pvdnJ6Zmt0Zmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjUzOTUsImV4cCI6MjA5MzUwMTM5NX0.dvk2FSggHEjRa1_Qh_ThKnZwVgFjgq2v5-ArdH-fVkU';
var sb=supabase.createClient(SB_URL,SB_KEY);
var CU=null,CP=null,ROLE='',MODE='login',TRIV=null,TRIDX=0;
var TRPATH=[[310,210],[332,190],[362,180],[392,198],[412,218],[402,248],[372,258],[342,243],[310,228]];

var SITTERS=[
  {id:'d1',name:'Sophie M.',location:'Liège',price:25,rating:4.9,rc:87,bio:'Passionnée par les animaux, je prends soin de vos chiens comme des miens.',tags:['Petits chiens','Chats'],avail:true,prem:true},
  {id:'d2',name:'Julien P.',location:'Namur',price:22,rating:4.8,rc:61,bio:'Grand jardin privé, vos chiens adorent venir chez moi.',tags:['Grands chiens','Jardins'],avail:true,prem:true},
  {id:'d3',name:'Emma D.',location:'Charleroi',price:30,rating:5.0,rc:112,bio:'Vétérinaire de formation, votre chien est entre de bonnes mains.',tags:['Chiots','Vétérinaire'],avail:false,prem:true},
  {id:'d4',name:'Lucas B.',location:'Mons',price:20,rating:4.7,rc:43,bio:'Éducateur canin certifié.',tags:['Éducation'],avail:true,prem:false},
  {id:'d5',name:'Clara R.',location:'Verviers',price:18,rating:4.6,rc:29,bio:'Disponible toute la journée.',tags:['Petits chiens'],avail:true,prem:false},
  {id:'d6',name:'Marc B.',location:'Arlon',price:28,rating:4.9,rc:74,bio:'Compte-rendu quotidien photos/vidéos.',tags:['Service VIP'],avail:false,prem:true},
];

// ── UTILS ──
function st(n){return'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));}
function al(name){return(name||'?')[0].toUpperCase();}
function stbadge(s){var m={pending:['stp','En attente'],confirmed:['stc','Confirmée'],done:['std','Terminée'],cancelled:['std','Annulée']};var x=m[s]||['std','?'];return'<span class="st '+x[0]+'">'+x[1]+'</span>';}
function el(id){return document.getElementById(id);}
function html(id,h){var e=el(id);if(e)e.innerHTML=h;}

// ── AUTH ──
function setMode(m){
  MODE=m;
  el('tl').className='atab'+(m==='login'?' on':'');
  el('tr').className='atab'+(m==='register'?' on':'');
  el('rfields').style.display=m==='register'?'block':'none';
  el('asubmit').textContent=m==='login'?'Se connecter →':'Créer mon compte →';
  el('aerr').textContent='';
}
function selRole(r){
  ROLE=r;
  el('ro').className='rbtn'+(r==='owner'?' on':'');
  el('rs').className='rbtn'+(r==='sitter'?' on':'');
}
async function doAuth(){
  var email=el('aemail').value.trim();
  var pass=el('apass').value;
  var errEl=el('aerr');
  var btn=el('asubmit');
  errEl.textContent='';
  btn.textContent='...';
  btn.disabled=true;
  try{
    if(MODE==='login'){
      var r=await sb.auth.signInWithPassword({email:email,password:pass});
      if(r.error)throw r.error;
      var p=await sb.from('profiles').select('*').eq('user_id',r.data.user.id).single();
      startApp(r.data.user,p.data);
    }else{
      var name=el('aname').value.trim();
      if(!ROLE){errEl.textContent='Choisissez votre rôle';btn.textContent='Créer mon compte →';btn.disabled=false;return;}
      if(!name){errEl.textContent='Entrez votre prénom';btn.textContent='Créer mon compte →';btn.disabled=false;return;}
      var r2=await sb.auth.signUp({email:email,password:pass});
      if(r2.error)throw r2.error;
      await sb.from('profiles').insert({user_id:r2.data.user.id,role:ROLE,name:name,location:'Belgique'});
      await new Promise(function(res){setTimeout(res,600);});
      var p2=await sb.from('profiles').select('*').eq('user_id',r2.data.user.id).single();
      startApp(r2.data.user,p2.data);
    }
  }catch(e){
    errEl.textContent=e.message==='Invalid login credentials'?'Email ou mot de passe incorrect':e.message;
    btn.textContent=MODE==='login'?'Se connecter →':'Créer mon compte →';
    btn.disabled=false;
  }
}

// ── APP START ──
function startApp(user,profile){
  CU=user;CP=profile;
  el('auth').style.display='none';
  el('app').style.display='flex';
  el('uav').textContent=al(profile&&profile.name?profile.name:user.email);
  el('uname').textContent=(profile&&profile.name)||'Utilisateur';
  var isSitter=profile&&profile.role==='sitter';
  el('urole').textContent=isSitter?'Petsitteur':'Propriétaire';
  el('rlabel').textContent=isSitter?'PETSITTEUR':'PROPRIÉTAIRE';
  el('rlabel').style.color=isSitter?'#3DD68C':'#4D8EFF';
  buildNav();
  showPage(isSitter?'sdash':'odash');
}
async function doLogout(){
  await sb.auth.signOut();
  if(TRIV){clearInterval(TRIV);TRIV=null;}
  CU=CP=null;
  el('app').style.display='none';
  el('auth').style.display='flex';
}

// ── NAV ──
function buildNav(){
  var isSitter=CP&&CP.role==='sitter';
  var items=isSitter?[
    {id:'sdash',ic:'◈',lb:'Tableau de bord'},
    {id:'sbookings',ic:'📅',lb:'Réservations'},
    {id:'msgs',ic:'💬',lb:'Messages',badge:2},
    {id:'analytics',ic:'📊',lb:'Analytics'},
    {id:'sprofile',ic:'👤',lb:'Mon profil'},
    {id:'tracking',ic:'📡',lb:'Suivi Live'},
  ]:[
    {id:'odash',ic:'◈',lb:'Accueil'},
    {id:'sitters',ic:'🐾',lb:'Petsitteurs'},
    {id:'oresas',ic:'📅',lb:'Réservations'},
    {id:'msgs',ic:'💬',lb:'Messages',badge:2},
    {id:'tracking',ic:'📡',lb:'Suivi Live'},
    {id:'reviews',ic:'⭐',lb:'Avis'},
  ];
  html('snav',items.map(function(n){
    return'<div class="ni" data-page="'+n.id+'" onclick="showPage(\''+n.id+'\')"><span style="font-size:16px;width:18px;text-align:center">'+n.ic+'</span><span>'+n.lb+'</span>'+(n.badge?'<span class="nbadge">'+n.badge+'</span>':'')+'</div>';
  }).join(''));
}
function showPage(id){
  if(TRIV){clearInterval(TRIV);TRIV=null;}
  document.querySelectorAll('.ni').forEach(function(n){n.classList.toggle('on',n.dataset.page===id);});
  var m=el('main');
  m.innerHTML='';
  var pages={odash:odash,sitters:pgSitters,oresas:oresas,msgs:pgMsgs,tracking:pgTracking,reviews:pgReviews,sdash:sdash,sbookings:sbookings,analytics:pgAnalytics,sprofile:pgSprofile};
  if(pages[id])pages[id](m);
}

// ── OWNER DASHBOARD ──
async function odash(el){
  var r=await sb.from('reservations').select('*').eq('owner_id',(CP&&CP.id)||'').order('created_at',{ascending:false});
  var resa=r.data||[];
  var active=resa.filter(function(x){return x.status!=='done'&&x.status!=='cancelled';});
  el.innerHTML='<div class="ptitle">Bonjour, '+(CP&&CP.name||'là')+' 👋</div><div class="psub">Bienvenue sur DogLink Belgique</div>'
  +'<div class="g4" style="margin-bottom:16px">'
  +'<div class="card"><div style="font-size:22px">📅</div><div class="sv" style="color:#4D8EFF">'+active.length+'</div><div class="sl">Réservations actives</div></div>'
  +'<div class="card"><div style="font-size:22px">🐾</div><div class="sv" style="color:#3DD68C">'+SITTERS.filter(function(s){return s.avail;}).length+'</div><div class="sl">Petsitteurs disponibles</div></div>'
  +'<div class="card"><div style="font-size:22px">💬</div><div class="sv" style="color:#FF6B4A">2</div><div class="sl">Messages non lus</div></div>'
  +'<div class="card"><div style="font-size:22px">⭐</div><div class="sv" style="color:#F0C060">4.9</div><div class="sl">Note moyenne</div></div>'
  +'</div>'
  +'<div class="g2">'
