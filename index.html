<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DogLink</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0D0F18;color:#EEE9FF}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#2A2D40;border-radius:4px}
.hidden{display:none!important}
/* AUTH */
#auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-box{background:#13151F;border:1px solid #2A2D40;border-radius:28px;padding:40px;width:100%;max-width:420px}
.auth-logo{font-family:'Fraunces',serif;font-size:30px;text-align:center;margin-bottom:6px;font-weight:600}
.auth-logo span{color:#FF6B4A}
.auth-sub{text-align:center;color:#7B7F9E;font-size:14px;margin-bottom:28px}
.auth-tabs{display:flex;background:#1C1F2E;border-radius:14px;padding:4px;margin-bottom:24px}
.auth-tab{flex:1;padding:10px;border:none;background:transparent;color:#7B7F9E;font-weight:600;font-size:14px;cursor:pointer;border-radius:10px;font-family:inherit;transition:all .2s}
.auth-tab.active{background:#252838;color:#EEE9FF}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.role-btn{padding:18px 14px;border:1.5px solid #2A2D40;border-radius:16px;background:transparent;color:#EEE9FF;cursor:pointer;text-align:center;font-family:inherit;transition:all .2s}
.role-btn.sel{border-color:#FF6B4A;background:rgba(255,107,74,.08)}
.role-icon{font-size:28px;display:block;margin-bottom:6px}
.role-label{font-weight:700;font-size:14px}
.role-desc{font-size:11px;color:#7B7F9E;margin-top:2px}
.inp{width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:12px;padding:12px 16px;color:#EEE9FF;font-size:14px;font-family:inherit;outline:none;margin-bottom:12px}
.inp:focus{border-color:#FF6B4A}
.auth-btn{width:100%;background:linear-gradient(135deg,#FF6B4A,#E05535);color:white;border:none;padding:14px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;margin-top:6px}
.auth-err{color:#FF6B4A;font-size:13px;text-align:center;margin-top:10px}
/* APP */
#app-screen{display:flex;height:100vh}
.sidebar{width:240px;background:#13151F;border-right:1px solid #2A2D40;display:flex;flex-direction:column;padding:22px 12px;flex-shrink:0}
.s-logo{font-family:'Fraunces',serif;font-size:24px;font-weight:600;padding-left:10px;margin-bottom:4px}
.s-logo span{color:#FF6B4A}
.s-role{font-size:10px;font-weight:700;letter-spacing:1px;padding-left:10px;margin-bottom:20px}
.s-nav{flex:1;display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:#7B7F9E;border-left:3px solid transparent;transition:all .2s}
.nav-item:hover{background:#1C1F2E}
.nav-item.active{background:#1C1F2E;color:#EEE9FF;border-left-color:#F0C060}
.nav-badge{margin-left:auto;background:#FF6B4A;color:white;border-radius:20px;font-size:10px;font-weight:800;padding:1px 7px}
.s-user{border-top:1px solid #2A2D40;padding-top:14px;display:flex;align-items:center;gap:10px;padding-left:6px;margin-top:auto}
.avatar{width:38px;height:38px;border-radius:50%;background:#252838;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#F0C060;flex-shrink:0}
.avatar-lg{width:64px;height:64px;font-size:26px}
.s-uname{font-size:13px;font-weight:700}
.s-urole{font-size:11px;color:#7B7F9E}
.logout-btn{background:none;border:none;color:#7B7F9E;cursor:pointer;font-size:11px;font-family:inherit}
.logout-btn:hover{color:#FF6B4A}
.main-area{flex:1;overflow-y:auto;padding:30px 34px}
/* PAGES */
.page{display:none}
.page.active{display:block}
.page-title{font-family:'Fraunces',serif;font-size:26px;font-weight:300;letter-spacing:-1px;margin-bottom:4px}
.page-sub{color:#7B7F9E;font-size:13px;margin-bottom:24px}
/* CARDS */
.card{background:#13151F;border:1px solid #2A2D40;border-radius:20px;padding:22px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat-val{font-family:'Fraunces',serif;font-size:26px;font-weight:700;margin-top:10px}
.stat-lbl{font-size:12px;color:#7B7F9E;margin-top:3px}
/* BUTTONS */
.btn{padding:9px 18px;border-radius:12px;font-weight:700;font-size:13px;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.btn:hover{opacity:.85;transform:translateY(-1px)}
.btn-primary{background:#FF6B4A;color:white}
.btn-outline{background:transparent;color:#EEE9FF;border:1.5px solid #2A2D40}
.btn-green{background:rgba(61,214,140,.15);color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.btn-gold{background:linear-gradient(135deg,#F0C060,#C8852A);color:#1A1000}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:10px}
.btn-full{width:100%;padding:13px;font-size:14px;border-radius:14px}
/* STATUS */
.status{font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px}
.s-pending{background:#2A1F08;color:#F0C060;border:1px solid rgba(240,192,96,.3)}
.s-confirmed{background:#0D2A1A;color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.s-done{background:#1A1A1A;color:#555;border:1px solid #333}
.s-cancelled{background:#2A0D0D;color:#FF6B4A;border:1px solid rgba(255,107,74,.3)}
/* FORM */
.form-label{font-size:11px;font-weight:700;color:#7B7F9E;letter-spacing:.8px;display:block;margin-bottom:6px;text-transform:uppercase}
.form-inp{width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:12px;padding:11px 15px;color:#EEE9FF;font-size:14px;font-family:inherit;outline:none;margin-bottom:14px}
.form-inp:focus{border-color:#FF6B4A}
textarea.form-inp{resize:vertical;min-height:80px}
/* TAG */
.tag{background:rgba(255,255,255,.06);color:#7B7F9E;font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px}
.premium-badge{background:linear-gradient(135deg,#F0C060,#C8852A);color:#1A1000;font-size:10px;font-weight:800;padding:3px 9px;border-radius:20px}
.stars{color:#F0C060;font-size:13px}
.online-dot{width:8px;height:8px;border-radius:50%;background:#3DD68C;display:inline-block}
/* CHAT */
.chat-wrap{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 130px);background:#13151F;border-radius:20px;border:1px solid #2A2D40;overflow:hidden}
.chat-list{border-right:1px solid #2A2D40;overflow-y:auto}
.chat-item{display:flex;align-items:center;gap:12px;padding:13px 15px;cursor:pointer;transition:background .15s}
.chat-item:hover{background:#1C1F2E}
.chat-item.sel{background:#252838}
.chat-body{display:flex;flex-direction:column;height:100%}
.chat-hdr{padding:15px 20px;border-bottom:1px solid #2A2D40;display:flex;align-items:center;gap:12px}
.msgs{flex:1;padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;justify-content:flex-start;gap:10px;align-items:flex-end}
.msg.mine{justify-content:flex-end}
.bubble{max-width:60%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.6}
.bubble.them{background:#1C1F2E;border-radius:18px 18px 18px 4px}
.bubble.mine{background:linear-gradient(135deg,#FF6B4A,#E05535);border-radius:18px 18px 4px 18px}
.msg-time{font-size:10px;color:#4A4D60;margin-top:3px}
.chat-foot{padding:13px 18px;border-top:1px solid #2A2D40;display:flex;gap:10px}
.chat-inp{flex:1;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:14px;padding:10px 15px;color:#EEE9FF;font-size:14px;font-family:inherit;outline:none}
.chat-inp:focus{border-color:#FF6B4A}
/* TRACKING */
.track-map{background:#070E08;border-radius:20px;border:1px solid #1D4A30;position:relative;height:400px;overflow:hidden}
/* SITTER CARDS */
.sitter-card{background:#13151F;border:1px solid #2A2D40;border-radius:20px;padding:20px;cursor:pointer;transition:all .2s}
.sitter-card:hover{transform:translateY(-3px);box-shadow:0 12px 36px rgba(0,0,0,.4)}
.sitter-card.premium{border-color:rgba(240,192,96,.3)}
/* MISC */
.divider{height:1px;background:#2A2D40;margin:18px 0}
.empty{text-align:center;padding:40px;color:#7B7F9E;font-size:14px}
.empty-ico{font-size:38px;display:block;margin-bottom:10px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.pulse{animation:pulse 2s infinite}
.ping{animation:ping 1.3s cubic-bezier(0,0,.2,1) infinite}
@media(max-width:700px){
  .sidebar{width:56px;padding:14px 8px}
  .s-logo,.s-role,.nav-item span:last-child,.s-uname,.s-urole,.logout-btn{display:none}
  .nav-item{padding:12px;justify-content:center}
  .main-area{padding:18px 14px}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .chat-wrap{grid-template-columns:1fr}
  .chat-list{display:none}
}
</style>
</head>
<body>

<!-- AUTH -->

<div id="auth-screen">
  <div class="auth-box">
    <div class="auth-logo">Dog<span>Link</span> 🐾</div>
    <div class="auth-sub">Petsitting Belgique</div>
    <div class="auth-tabs">
      <button class="auth-tab active" onclick="setMode('login')">Se connecter</button>
      <button class="auth-tab" onclick="setMode('register')">S'inscrire</button>
    </div>
    <div id="register-fields" class="hidden">
      <div class="role-grid">
        <button class="role-btn" id="role-owner" onclick="selectRole('owner')">
          <span class="role-icon">🐕</span>
          <span class="role-label">Propriétaire</span>
          <span class="role-desc">Je cherche un petsitter</span>
        </button>
        <button class="role-btn" id="role-sitter" onclick="selectRole('sitter')">
          <span class="role-icon">🐾</span>
          <span class="role-label">Petsitteur</span>
          <span class="role-desc">Je garde des chiens</span>
        </button>
      </div>
      <input class="inp" id="auth-name" placeholder="Votre prénom">
    </div>
    <input class="inp" id="auth-email" type="email" placeholder="Email">
    <input class="inp" id="auth-password" type="password" placeholder="Mot de passe" onkeydown="if(event.key==='Enter')doAuth()">
    <button class="auth-btn" id="auth-submit-btn" onclick="doAuth()">Se connecter →</button>
    <div class="auth-err hidden" id="auth-err"></div>
  </div>
</div>

<!-- APP -->

<div id="app-screen" class="hidden">
  <aside class="sidebar">
    <div class="s-logo">Dog<span>Link</span></div>
    <div class="s-role" id="role-label"></div>
    <nav class="s-nav" id="sidebar-nav"></nav>
    <div class="s-user">
      <div class="avatar" id="user-avatar">?</div>
      <div>
        <div class="s-uname" id="user-name">Utilisateur</div>
        <div class="s-urole" id="user-role-display"></div>
        <button class="logout-btn" onclick="doLogout()">Déconnexion</button>
      </div>
    </div>
  </aside>
  <main class="main-area" id="main-area"></main>
</div>

<script>
const SUPA_URL = 'https://mxvzgngtgjovrzfktfhw.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14dnpnbmd0Z2pvdnJ6Zmt0Zmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjUzOTUsImV4cCI6MjA5MzUwMTM5NX0.dvk2FSggHEjRa1_Qh_ThKnZwVgFjgq2v5-ArdH-fVkU';
const sb = supabase.createClient(SUPA_URL, SUPA_KEY);

let currentUser = null, currentProfile = null, currentRole = '', authMode = 'login';
let trackInterval = null, trackIdx = 0;
const trackPath = [[310,250],[332,228],[362,218],[392,238],[412,260],[402,292],[372,302],[342,286],[310,268]];

const DEMO_SITTERS = [
  {id:'d1',name:'Sophie M.',location:'Liège',price:25,rating:4.9,reviews_count:87,bio:'Passionnée par les animaux, je prends soin de vos chiens comme des miens.',tags:['Petits chiens','Chats'],available:true,premium:true},
  {id:'d2',name:'Julien P.',location:'Namur',price:22,rating:4.8,reviews_count:61,bio:'Grand jardin privé, vos chiens adorent venir chez moi.',tags:['Grands chiens','Jardins'],available:true,premium:true},
  {id:'d3',name:'Emma D.',location:'Charleroi',price:30,rating:5.0,reviews_count:112,bio:'Vétérinaire de formation, votre chien est entre de bonnes mains.',tags:['Chiots','Vétérinaire'],available:false,premium:true},
  {id:'d4',name:'Lucas B.',location:'Mons',price:20,rating:4.7,reviews_count:43,bio:'Éducateur canin certifié.',tags:['Éducation','Grandes races'],available:true,premium:false},
  {id:'d5',name:'Clara R.',location:'Verviers',price:18,rating:4.6,reviews_count:29,bio:'Disponible toute la journée grâce au télétravail.',tags:['Petits chiens','Chats'],available:true,premium:false},
  {id:'d6',name:'Marc B.',location:'Arlon',price:28,rating:4.9,reviews_count:74,bio:'Compte-rendu quotidien photos/vidéos.',tags:['Service VIP'],available:false,premium:true},
];

// ── UTILS ──────────────────────────────────────
function stars(n){return '★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));}
function avatarLetter(name){return (name||'?')[0].toUpperCase();}
function statusBadge(s){
  const m={pending:['s-pending','En attente'],confirmed:['s-confirmed','Confirmée'],done:['s-done','Terminée'],cancelled:['s-cancelled','Annulée']};
  return `<span class="status ${(m[s]||['s-done','?'])[0]}">${(m[s]||['','?'])[1]}</span>`;
}

// ── AUTH ──────────────────────────────────────
function setMode(m){
  authMode = m;
  document.querySelectorAll('.auth-tab').forEach((t,i)=>t.classList.toggle('active',(m==='login'?i===0:i===1)));
  document.getElementById('register-fields').classList.toggle('hidden', m==='login');
  document.getElementById('auth-submit-btn').textContent = m==='login'?'Se connecter →':'Créer mon compte →';
}
function selectRole(r){
  currentRole = r;
  document.getElementById('role-owner').classList.toggle('sel', r==='owner');
  document.getElementById('role-sitter').classList.toggle('sel', r==='sitter');
}
async function doAuth(){
  const email = document.getElementById('auth-email').value.trim();
  const pass = document.getElementById('auth-password').value;
  const errEl = document.getElementById('auth-err');
  const btn = document.getElementById('auth-submit-btn');
  errEl.classList.add('hidden'); btn.textContent='...'; btn.disabled=true;
  try {
    if(authMode==='login'){
      const {data,error} = await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
      const {data:profile} = await sb.from('profiles').select('*').eq('user_id',data.user.id).single();
      startApp(data.user, profile);
    } else {
      const name = document.getElementById('auth-name').value.trim();
      if(!currentRole){throw{message:'Choisissez votre rôle'};}
      if(!name){throw{message:'Entrez votre prénom'};}
      const {data,error} = await sb.auth.signUp({email,password:pass});
      if(error) throw error;
      await sb.from('profiles').insert({user_id:data.user.id,role:currentRole,name,location:'Belgique'});
      await new Promise(r=>setTimeout(r,800));
      const {data:profile} = await sb.from('profiles').select('*').eq('user_id',data.user.id).single();
      startApp(data.user, profile);
    }
  } catch(e){
    errEl.textContent = e.message==='Invalid login credentials'?'Email ou mot de passe incorrect':e.message;
    errEl.classList.remove('hidden');
    btn.textContent = authMode==='login'?'Se connecter →':'Créer mon compte →';
    btn.disabled=false;
  }
}
function startApp(user, profile){
  currentUser=user; currentProfile=profile;
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('user-avatar').textContent = avatarLetter(profile?.name||user.email);
  document.getElementById('user-name').textContent = profile?.name||'Utilisateur';
  document.getElementById('user-role-display').textContent = profile?.role==='sitter'?'Petsitteur ✦':'Propriétaire 🐕';
  document.getElementById('role-label').textContent = profile?.role==='sitter'?'PETSITTEUR':'PROPRIÉTAIRE';
  document.getElementById('role-label').style.color = profile?.role==='sitter'?'#3DD68C':'#4D8EFF';
  buildNav();
  showPage(profile?.role==='sitter'?'sitter-dashboard':'owner-dashboard');
}
async function doLogout(){
  await sb.auth.signOut();
  if(trackInterval) clearInterval(trackInterval);
  currentUser=currentProfile=null;
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

// ── NAV ──────────────────────────────────────
function buildNav(){
  const role = currentProfile?.role;
  const navItems = role==='sitter' ? [
    {id:'sitter-dashboard',icon:'◈',label:'Tableau de bord'},
    {id:'sitter-bookings',icon:'📅',label:'Réservations'},
    {id:'messages',icon:'💬',label:'Messages',badge:2},
    {id:'analytics',icon:'📊',label:'Analytics'},
    {id:'sitter-profile',icon:'👤',label:'Mon profil'},
    {id:'tracking',icon:'📡',label:'Suivi Live'},
  ] : [
    {id:'owner-dashboard',icon:'◈',label:'Accueil'},
    {id:'sitters-list',icon:'🐾',label:'Petsitteurs'},
    {id:'owner-reservations',icon:'📅',label:'Réservations'},
    {id:'messages',icon:'💬',label:'Messages',badge:2},
    {id:'tracking',icon:'📡',label:'Suivi Live'},
    {id:'reviews',icon:'⭐',label:'Avis'},
  ];
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = navItems.map(n=>`
    <div class="nav-item" id="nav-${n.id}" onclick="showPage('${n.id}')">
      <span style="font-size:17px;width:20px;text-align:center">${n.icon}</span>
      <span>${n.label}</span>
      ${n.badge?`<span class="nav-badge">${n.badge}</span>`:''}
    </div>`).join('');
}
function showPage(id){
  if(trackInterval){clearInterval(trackInterval);trackInterval=null;}
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const ni = document.getElementById('nav-'+id);
  if(ni) ni.classList.add('active');
  const main = document.getElementById('main-area');
  main.innerHTML = '';
  const pages = {
    'owner-dashboard': renderOwnerDashboard,
    'sitters-list': renderSittersList,
    'owner-reservations': renderOwnerReservations,
    'messages': renderMessages,
    'tracking': renderTracking,
    'reviews': renderReviews,
    'sitter-dashboard': renderSitterDashboard,
    'sitter-bookings': renderSitterBookings,
    'analytics': renderAnalytics,
    'sitter-profile': renderSitterProfile,
  };
  if(pages[id]) pages[id](main);
}

// ── OWNER DASHBOARD ──────────────────────────
async function renderOwnerDashboard(el){
  const {data:resa} = await sb.from('reservations').select('*').eq('owner_id',currentProfile?.id||'').order('created_at',{ascending:false});
  const active = (resa||[]).filter(r=>r.status!=='done'&&r.status!=='cancelled');
  el.innerHTML = `
    <div class="page-title">Bonjour, ${currentProfile?.name||'là'} 👋</div>
    <div class="page-sub">Bienvenue sur DogLink Belgique</div>
    <div class="grid4" style="margin-bottom:20px">
      <div class="card"><div style="font-size:24px">📅</div><div class="stat-val" style="color:#4D8EFF">${active.length}</div><div class="stat-lbl">Réservations actives</div></div>
      <div class="card"><div style="font-size:24px">🐾</div><div class="stat-val" style="color:#3DD68C">${DEMO_SITTERS.filter(s=>s.available).length}</div><div class="stat-lbl">Petsitteurs disponibles</div></div>
      <div class="card"><div style="font-size:24px">💬</div><div class="stat-val" style="color:#FF6B4A">2</div><div class="stat-lbl">Messages non lus</div></div>
      <div class="card"><div style="font-size:24px">⭐</div><div class="stat-val" style="color:#F0C060">4.9</div><div class="stat-lbl">Note moyenne</div></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div style="font-weight:700;margin-bottom:16px">Prochaines réservations</div>
        ${active.length===0?`<div class="empty"><span class="empty-ico">📅</span>Aucune réservation<br><br><button class="btn btn-primary btn-sm" onclick="showPage('sitters-list')">Trouver un petsitteur</button></div>`
        :active.slice(0,3).map(r=>`
          <div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #2A2D40">
            <div class="avatar">${avatarLetter(r.sitter_name||'S')}</div>
            <div style="flex:1"><div style="font-weight:600;font-size:14px">${r.sitter_name||'Petsitteur'}</div><div style="color:#7B7F9E;font-size:12px">${r.type} · ${r.start_date}</div></div>
            ${statusBadge(r.status)}
          </div>`).join('')}
      </div>

async function doBook(sitterId,sitterName,price){
const dog=document.getElementById(‘book-dog’).value.trim();
const type=document.getElementById(‘book-type’).value;
const start=document.getElementById(‘book-start’).value;
const end=document.getElementById(‘book-end’).value;
const notes=document.getElementById(‘book-notes’).value;
if(!dog||!start||!end){alert(‘Remplissez tous les champs.’);return;}
const days=Math.max(1,Math.ceil((new Date(end)-new Date(start))/(86400000)));
await sb.from(‘reservations’).insert({sitter_id:sitterId,owner_id:currentProfile?.id,sitter_name:sitterName,dog_name:dog,type,start_date:start,end_date:end,notes,price:price*days,status:‘pending’});
document.getElementById(‘book-form’).classList.add(‘hidden’);
document.getElementById(‘book-success’).classList.remove(‘hidden’);
setTimeout(()=>showPage(‘owner-reservations’),2000);
}

document.getElementById(‘p-avail-yes’).className=‘btn btn-green btn-sm’+(v?’’:’ btn-outline’);
document.getElementById(‘p-avail-no’).className=‘btn btn-sm’+(v?’’:’ btn-primary’)+(v?’ btn-outline’:’’);
}
async function saveProfile(){
const btn=document.getElementById(‘save-profile-btn’);
btn.textContent=‘Sauvegarde…’; btn.disabled=true;
await sb.from(‘profiles’).update({
name:document.getElementById(‘p-name’).value,
bio:document.getElementById(‘p-bio’).value,
location:document.getElementById(‘p-location’).value,
price:document.getElementById(‘p-price’).value,
available:profileAvail
}).eq(‘user_id’,currentUser.id);
const {data} = await sb.from(‘profiles’).select(’*’).eq(‘user_id’,currentUser.id).single();
currentProfile=data;
btn.textContent=‘✓ Sauvegardé !’; btn.style.background=’#3DD68C’;
setTimeout(()=>{btn.textContent=‘Sauvegarder’;btn.style.background=’’;btn.disabled=false;},2000);
}

<div style="position:relative">
<div class="avatar" style="width:36px;height:36px;font-size:14px">${avatarLetter(c.name)}</div>
${c.unread?`<span style="position:absolute;top:-2px;right:-2px;background:#FF6B4A;color:white;border-radius:20px;font-size:9px;font-weight:800;padding:1px 4px">${c.unread}</span>`:’’}

<div style="color:#7B7F9E;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px">${c.preview}</div>
</div>
</div>`).join('')} </div> <div class="chat-body"> <div class="chat-hdr"> <div class="avatar" style="width:36px;height:36px;font-size:14px">S</div> <div><div style="font-weight:700;font-size:15px">Sophie M.</div><div style="color:#3DD68C;font-size:12px;font-weight:600">● En ligne</div></div> </div> <div class="msgs" id="msgs-area"> ${chatMsgs.map(m=>`

</div>
</div>`).join('')} </div> <div class="chat-foot"> <input class="chat-inp" id="msg-inp" placeholder="Écrire un message…" onkeydown="if(event.key==='Enter')sendMsg()"> <button class="btn btn-primary" onclick="sendMsg()">Envoyer →</button> </div> </div> </div>`;
}
function sendMsg(){
const inp=document.getElementById(‘msg-inp’);
const txt=inp.value.trim();
if(!txt)return;
const area=document.getElementById(‘msgs-area’);
area.innerHTML+=`<div class="msg mine"><div><div class="bubble mine">${txt}</div><div class="msg-time" style="text-align:right">Maintenant</div></div></div>`;
inp.value=’’;
area.scrollTop=area.scrollHeight;
}
