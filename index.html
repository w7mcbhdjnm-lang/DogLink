<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DogLink</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;1,300&family=DM+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:#0D0F18;color:#EEE9FF}
button{font-family:inherit;-webkit-appearance:none;touch-action:manipulation;cursor:pointer}
input,select,textarea{font-family:inherit;-webkit-appearance:none}

#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#app{display:none}

.abox{background:#13151F;border:1px solid #2A2D40;border-radius:24px;padding:36px 28px;width:100%;max-width:400px}
.alogo{font-family:‘Fraunces’,serif;font-size:28px;font-weight:600;text-align:center;margin-bottom:6px}
.alogo span{color:#FF6B4A}
.asub{text-align:center;color:#7B7F9E;font-size:13px;margin-bottom:22px}

.atabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:#1C1F2E;border-radius:12px;padding:4px;margin-bottom:20px}
.atab{padding:10px;background:transparent;color:#7B7F9E;font-weight:600;font-size:14px;border-radius:9px;border:none;touch-action:manipulation;-webkit-appearance:none}
.atab.on{background:#252838;color:#EEE9FF}

#rfields{display:none;margin-bottom:4px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rbtn{padding:16px 8px;border:1.5px solid #2A2D40;border-radius:14px;background:transparent;color:#EEE9FF;text-align:center;touch-action:manipulation;-webkit-appearance:none}
.rbtn.on{border-color:#FF6B4A;background:rgba(255,107,74,.1)}
.rico{font-size:24px;display:block;margin-bottom:5px}
.rlbl{font-weight:700;font-size:13px;display:block}
.rdsc{font-size:10px;color:#7B7F9E;margin-top:2px;display:block}

.ainp{display:block;width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:11px;padding:12px 14px;color:#EEE9FF;font-size:14px;outline:none;margin-bottom:10px;-webkit-appearance:none}
.ainp:focus{border-color:#FF6B4A}
.asbtn{display:block;width:100%;background:linear-gradient(135deg,#FF6B4A,#E05535);color:white;padding:14px;border-radius:13px;font-weight:700;font-size:15px;margin-top:6px;border:none;touch-action:manipulation;-webkit-appearance:none}
.aerr{color:#FF6B4A;font-size:13px;text-align:center;margin-top:10px;min-height:18px}

/* APP */
.appwrap{display:flex;min-height:100vh}
.sb{width:220px;background:#13151F;border-right:1px solid #2A2D40;display:flex;flex-direction:column;padding:18px 10px;min-height:100vh;flex-shrink:0}
.sblogo{font-family:‘Fraunces’,serif;font-size:21px;font-weight:600;padding-left:10px;margin-bottom:3px}
.sblogo span{color:#FF6B4A}
.sbrole{font-size:10px;font-weight:700;letter-spacing:1px;padding-left:10px;margin-bottom:16px}
.sbnav{flex:1;display:flex;flex-direction:column;gap:2px}
.ni{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;color:#7B7F9E;border-left:3px solid transparent;touch-action:manipulation}
.ni:hover,.ni.on{background:#1C1F2E;color:#EEE9FF;border-left-color:#F0C060}
.nbadge{margin-left:auto;background:#FF6B4A;color:white;border-radius:20px;font-size:9px;font-weight:800;padding:1px 5px}
.sbu{border-top:1px solid #2A2D40;padding-top:12px;display:flex;align-items:center;gap:8px;margin-top:auto;padding-left:6px}
.av{width:34px;height:34px;border-radius:50%;background:#252838;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#F0C060;flex-shrink:0}
.avlg{width:56px;height:56px;font-size:20px}
.sbun{font-size:12px;font-weight:700}
.sbur{font-size:10px;color:#7B7F9E}
.lbtn{background:none;border:none;color:#7B7F9E;cursor:pointer;font-size:10px;font-family:inherit;display:block;margin-top:2px;touch-action:manipulation}

.main{flex:1;padding:26px 28px;overflow-y:auto}
.ptitle{font-family:‘Fraunces’,serif;font-size:22px;font-weight:300;letter-spacing:-1px;margin-bottom:3px}
.psub{color:#7B7F9E;font-size:12px;margin-bottom:20px}
.card{background:#13151F;border:1px solid #2A2D40;border-radius:16px;padding:18px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.sv{font-family:‘Fraunces’,serif;font-size:22px;font-weight:700;margin-top:7px}
.sl{font-size:11px;color:#7B7F9E;margin-top:2px}
.btn{padding:7px 14px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;border:none;font-family:inherit;touch-action:manipulation;-webkit-appearance:none;display:inline-block}
.bp{background:#FF6B4A;color:white}
.bo{background:transparent;color:#EEE9FF;border:1.5px solid #2A2D40}
.bg{background:rgba(61,214,140,.15);color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.bsm{padding:5px 11px;font-size:11px;border-radius:8px}
.bfull{width:100%;padding:11px;font-size:13px;border-radius:12px;margin-bottom:8px}
.st{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px}
.stp{background:#2A1F08;color:#F0C060;border:1px solid rgba(240,192,96,.3)}
.stc{background:#0D2A1A;color:#3DD68C;border:1px solid rgba(61,214,140,.3)}
.std{background:#1A1A1A;color:#555;border:1px solid #333}
.fl{font-size:10px;font-weight:700;color:#7B7F9E;letter-spacing:.8px;display:block;margin-bottom:5px;text-transform:uppercase}
.fi{display:block;width:100%;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:10px;padding:10px 12px;color:#EEE9FF;font-size:13px;font-family:inherit;outline:none;margin-bottom:11px;-webkit-appearance:none}
.fi:focus{border-color:#FF6B4A}
textarea.fi{resize:vertical;min-height:70px}
.tag{background:rgba(255,255,255,.06);color:#7B7F9E;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px}
.pbadge{background:linear-gradient(135deg,#F0C060,#C8852A);color:#1A1000;font-size:9px;font-weight:800;padding:2px 6px;border-radius:20px}
.stars{color:#F0C060;font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;background:#3DD68C;display:inline-block}
.empty{text-align:center;padding:30px;color:#7B7F9E;font-size:13px}
.ei{font-size:32px;display:block;margin-bottom:8px}
.loading{text-align:center;padding:30px;color:#7B7F9E}

.cw{display:grid;grid-template-columns:240px 1fr;height:calc(100vh - 90px);background:#13151F;border-radius:16px;border:1px solid #2A2D40;overflow:hidden}
.cl{border-right:1px solid #2A2D40;overflow-y:auto}
.ci{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;touch-action:manipulation}
.ci.on{background:#252838}
.cb{display:flex;flex-direction:column}
.ch{padding:12px 16px;border-bottom:1px solid #2A2D40;display:flex;align-items:center;gap:10px}
.ms{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:calc(100vh - 220px)}
.mg{display:flex;align-items:flex-end;gap:7px}
.mg.me{justify-content:flex-end}
.mb{max-width:60%;padding:8px 12px;border-radius:14px;font-size:13px;line-height:1.6}
.mb.th{background:#1C1F2E;border-radius:14px 14px 14px 3px}
.mb.me{background:linear-gradient(135deg,#FF6B4A,#E05535);border-radius:14px 14px 3px 14px}
.mt{font-size:10px;color:#4A4D60;margin-top:2px}
.cf{padding:11px 14px;border-top:1px solid #2A2D40;display:flex;gap:8px}
.cinp{flex:1;background:#1C1F2E;border:1.5px solid #2A2D40;border-radius:12px;padding:9px 12px;color:#EEE9FF;font-size:13px;font-family:inherit;outline:none;-webkit-appearance:none}
.cinp:focus{border-color:#FF6B4A}
.tm{background:#070E08;border-radius:16px;border:1px solid #1D4A30;position:relative;height:360px;overflow:hidden}
.sc{display:flex;flex-direction:column;gap:10px}
.ic{background:#13151F;border-radius:12px;padding:11px 13px;border:1px solid #2A2D40;display:flex;align-items:center;gap:10px}

@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.4)}}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.pulse{animation:pulse 2s infinite}
.ping{animation:ping 1.3s cubic-bezier(0,0,.2,1) infinite}

@media(max-width:650px){
.sb{width:48px;padding:12px 6px}
.sblogo,.sbrole,.ni span:not(:first-child),.sbun,.sbur,.lbtn{display:none}
.ni{padding:9px;justify-content:center}
.main{padding:14px 10px}
.g2,.g3,.g4{grid-template-columns:1fr}
.cw{grid-template-columns:1fr}.cl{display:none}
}
</style>

</head>
<body>

<div id="auth">
  <div class="abox">
    <div class="alogo">Dog<span>Link</span></div>
    <div class="asub">Petsitting Belgique</div>
    <div class="atabs">
      <button class="atab on" id="btnLogin" type="button">Se connecter</button>
      <button class="atab" id="btnRegister" type="button">S'inscrire</button>
    </div>
    <div id="rfields">
      <div class="roles">
        <button class="rbtn" id="btnOwner" type="button">
          <span class="rico">🐕</span>
          <span class="rlbl">Propriétaire</span>
          <span class="rdsc">Je cherche un petsitter</span>
        </button>
        <button class="rbtn" id="btnSitter" type="button">
          <span class="rico">
            <svg width="28" height="28" viewBox="0 0 60 60" fill="none">
              <circle cx="18" cy="9" r="5" fill="#EEE9FF"/>
              <path d="M18 16L15 30L10 44L15 44L18 34L21 44L26 44L23 30L25 22" stroke="#EEE9FF" stroke-width="2.5" stroke-linecap="round" fill="none"/>
              <path d="M21 20L27 26Q33 30 36 34" stroke="#EEE9FF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <ellipse cx="42" cy="37" rx="8" ry="5" fill="#EEE9FF" transform="rotate(-8 42 37)"/>
              <circle cx="48" cy="32" r="4.5" fill="#EEE9FF"/>
              <path d="M35 36Q30 30 33 26" stroke="#EEE9FF" stroke-width="1.8" stroke-linecap="round" fill="none"/>
              <line x1="36" y1="40" x2="34" y2="48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <line x1="41" y1="42" x2="40" y2="48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <line x1="46" y1="42" x2="46" y2="48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
              <line x1="51" y1="41" x2="52" y2="48" stroke="#EEE9FF" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </span>
          <span class="rlbl">Petsitteur</span>
          <span class="rdsc">Je garde des chiens</span>
        </button>
      </div>
      <input class="ainp" id="aname" placeholder="Votre prénom" type="text" autocomplete="given-name">
    </div>
    <input class="ainp" id="aemail" type="email" placeholder="Email" autocomplete="email">
    <input class="ainp" id="apass" type="password" placeholder="Mot de passe" autocomplete="current-password">
    <button class="asbtn" id="btnSubmit" type="button">Se connecter →</button>
    <div class="aerr" id="aerr"></div>
  </div>
</div>

<div id="app">
  <div class="appwrap">
    <aside class="sb">
      <div class="sblogo">Dog<span>Link</span></div>
      <div class="sbrole" id="rlabel"></div>
      <nav class="sbnav" id="snav"></nav>
      <div class="sbu">
        <div class="av" id="uav">?</div>
        <div>
          <div class="sbun" id="uname"></div>
          <div class="sbur" id="urole"></div>
          <button class="lbtn" id="btnLogout" type="button">Déconnexion</button>
        </div>
      </div>
    </aside>
    <main class="main" id="main">
      <div class="loading">Chargement...</div>
    </main>
  </div>
</div>

<!-- Load Supabase LAST so it's ready -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// Wait for everything to be ready
window.addEventListener('load', function() {
  var sb, CU=null, CP=null, ROLE='', MODE='login', TRIV=null, TRIDX=0;
  var TRPATH=[[310,200],[332,180],[362,170],[392,188],[412,208],[402,238],[372,248],[342,232],[310,218]];
  
  var SITTERS=[
    {id:'d1',name:'Sophie M.',loc:'Liège',price:25,rating:4.9,rc:87,bio:'Passionnée par les animaux, je prends soin de vos chiens comme des miens.',tags:['Petits chiens','Chats'],avail:true,prem:true},
    {id:'d2',name:'Julien P.',loc:'Namur',price:22,rating:4.8,rc:61,bio:'Grand jardin privé.',tags:['Grands chiens'],avail:true,prem:true},
    {id:'d3',name:'Emma D.',loc:'Charleroi',price:30,rating:5.0,rc:112,bio:'Vétérinaire de formation.',tags:['Chiots','Vétérinaire'],avail:false,prem:true},
    {id:'d4',name:'Lucas B.',loc:'Mons',price:20,rating:4.7,rc:43,bio:'Éducateur canin certifié.',tags:['Éducation'],avail:true,prem:false},
    {id:'d5',name:'Clara R.',loc:'Verviers',price:18,rating:4.6,rc:29,bio:'Disponible toute la journée.',tags:['Petits chiens'],avail:true,prem:false},
    {id:'d6',name:'Marc B.',loc:'Arlon',price:28,rating:4.9,rc:74,bio:'Compte-rendu quotidien.',tags:['VIP'],avail:false,prem:true},
  ];

  // Init Supabase safely
  try {
    sb = supabase.createClient(
      'https://mxvzgngtgjovrzfktfhw.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14dnpnbmd0Z2pvdnJ6Zmt0Zmh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MjUzOTUsImV4cCI6MjA5MzUwMTM5NX0.dvk2FSggHEjRa1_Qh_ThKnZwVgFjgq2v5-ArdH-fVkU'
    );
  } catch(e) { console.error('Supabase error:', e); }

  function $(id){return document.getElementById(id);}
  function st(n){return'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));}
  function al(s){return((s||'?')[0]||'?').toUpperCase();}
  function stb(s){var m={pending:'<span class="st stp">En attente</span>',confirmed:'<span class="st stc">Confirmée</span>',done:'<span class="st std">Terminée</span>',cancelled:'<span class="st std">Annulée</span>'};return m[s]||m.done;}

  // AUTH
  $('btnLogin').onclick = function(){ setMode('login'); };
  $('btnRegister').onclick = function(){ setMode('register'); };
  $('btnOwner').onclick = function(){ setRole('owner'); };
  $('btnSitter').onclick = function(){ setRole('sitter'); };
  $('btnSubmit').onclick = function(){ doAuth(); };
  $('apass').onkeydown = function(e){ if(e.key==='Enter') doAuth(); };

  function setMode(m) {
    MODE = m;
    $('btnLogin').className = 'atab' + (m==='login'?' on':'');
    $('btnRegister').className = 'atab' + (m==='register'?' on':'');
    $('rfields').style.display = m==='register' ? 'block' : 'none';
    $('btnSubmit').textContent = m==='login' ? 'Se connecter →' : 'Créer mon compte →';
    $('aerr').textContent = '';
  }

  function setRole(r) {
    ROLE = r;
    $('btnOwner').className = 'rbtn' + (r==='owner'?' on':'');
    $('btnSitter').className = 'rbtn' + (r==='sitter'?' on':'');
  }

  async function doAuth() {
    if(!sb){$('aerr').textContent='Erreur de connexion. Rechargez la page.';return;}
    var email=$('aemail').value.trim();
    var pass=$('apass').value;
    var btn=$('btnSubmit');
    $('aerr').textContent='';
    btn.textContent='...';
    btn.disabled=true;
    try {
      if(MODE==='login'){
        var r=await sb.auth.signInWithPassword({email:email,password:pass});
        if(r.error)throw r.error;
        var p=await sb.from('profiles').select('*').eq('user_id',r.data.user.id).single();
        startApp(r.data.user, p.data);
      } else {
        var name=$('aname').value.trim();
        if(!ROLE){$('aerr').textContent='Choisissez votre rôle';btn.textContent='Créer mon compte →';btn.disabled=false;return;}
        if(!name){$('aerr').textContent='Entrez votre prénom';btn.textContent='Créer mon compte →';btn.disabled=false;return;}
        var r2=await sb.auth.signUp({email:email,password:pass});
        if(r2.error)throw r2.error;
        await sb.from('profiles').insert({user_id:r2.data.user.id,role:ROLE,name:name,location:'Belgique'});
        await new Promise(function(res){setTimeout(res,500);});
        var p2=await sb.from('profiles').select('*').eq('user_id',r2.data.user.id).single();
        startApp(r2.data.user, p2.data);
      }
    } catch(e) {
      $('aerr').textContent = e.message==='Invalid login credentials'?'Email ou mot de passe incorrect':e.message;
      btn.textContent = MODE==='login'?'Se connecter →':'Créer mon compte →';
      btn.disabled = false;
    }
  }

  function startApp(user, profile) {
    CU=user; CP=profile;
    $('auth').style.display='none';
    $('app').style.display='block';
    $('uav').textContent = al(profile&&profile.name?profile.name:user.email);
    $('uname').textContent = (profile&&profile.name)||'Utilisateur';
    $('urole').textContent = (profile&&profile.role==='sitter')?'Petsitteur':'Propriétaire';
    $('rlabel').textContent = (profile&&profile.role==='sitter')?'PETSITTEUR':'PROPRIÉTAIRE';
    $('rlabel').style.color = (profile&&profile.role==='sitter')?'#3DD68C':'#4D8EFF';
    $('btnLogout').onclick = function(){ doLogout(); };
    buildNav();
    showPage((profile&&profile.role==='sitter')?'sdash':'odash');
  }

  async function doLogout(){
    if(sb) await sb.auth.signOut();
    if(TRIV){clearInterval(TRIV);TRIV=null;}
    CU=CP=null;
    $('app').style.display='none';
    $('auth').style.display='flex';
  }

  function buildNav(){
    var isSitter=CP&&CP.role==='sitter';
    var items=isSitter?[
      {id:'sdash',ic:'◈',lb:'Tableau de bord'},
      {id:'sbookings',ic:'📅',lb:'Réservations'},
      {id:'msgs',ic:'💬',lb:'Messages',b:2},
      {id:'analytics',ic:'📊',lb:'Analytics'},
      {id:'sprofile',ic:'👤',lb:'Mon profil'},
      {id:'tracking',ic:'📡',lb:'Suivi Live'},
    ]:[
      {id:'odash',ic:'◈',lb:'Accueil'},
      {id:'sitters',ic:'🐾',lb:'Petsitteurs'},
      {id:'oresas',ic:'📅',lb:'Réservations'},
      {id:'msgs',ic:'💬',lb:'Messages',b:2},
      {id:'tracking',ic:'📡',lb:'Suivi Live'},
      {id:'reviews',ic:'⭐',lb:'Avis'},
    ];
    $('snav').innerHTML=items.map(function(n){
      return '<div class="ni" data-p="'+n.id+'" onclick="window._sp(\''+n.id+'\')">'
        +'<span style="font-size:15px;width:17px;text-align:center">'+n.ic+'</span>'
        +'<span>'+n.lb+'</span>'
        +(n.b?'<span class="nbadge">'+n.b+'</span>':'')
        +'</div>';
    }).join('');
  }

  window._sp = function(id){ showPage(id); };

  function showPage(id){
    if(TRIV){clearInterval(TRIV);TRIV=null;}
    document.querySelectorAll('.ni').forEach(function(n){n.classList.toggle('on',n.dataset.p===id);});
    var m=$('main');
    m.innerHTML='<div class="loading">Chargement...</div>';
    var pages={odash:pgOdash,sitters:pgSitters,oresas:pgOresas,msgs:pgMsgs,tracking:pgTracking,reviews:pgReviews,sdash:pgSdash,sbookings:pgSbookings,analytics:pgAnalytics,sprofile:pgSprofile};
    if(pages[id]) pages[id](m);
  }

  // ── OWNER DASHBOARD ──
  async function pgOdash(m){
    var r=await sb.from('reservations').select('*').eq('owner_id',(CP&&CP.id)||'').order('created_at',{ascending:false});
    var resa=r.data||[];
    var active=resa.filter(function(x){return x.status!=='done'&&x.status!=='cancelled';});
    m.innerHTML='<div class="ptitle">Bonjour, '+(CP&&CP.name||'là')+' 👋</div><div class="psub">Bienvenue sur DogLink Belgique</div>'
    +'<div class="g4">'
    +'<div class="card"><div>📅</div><div class="sv" style="color:#4D8EFF">'+active.length+'</div><div class="sl">Réservations actives</div></div>'
    +'<div class="card"><div>🐾</div><div class="sv" style="color:#3DD68C">'+SITTERS.filter(function(s){return s.avail;}).length+'</div><div class="sl">Petsitteurs dispos</div></div>'
    +'<div class="card"><div>💬</div><div class="sv" style="color:#FF6B4A">2</div><div class="sl">Messages non lus</div></div>'
    +'<div class="card"><div>⭐</div><div class="sv" style="color:#F0C060">4.9</div><div class="sl">Note moyenne</div></div>'
    +'</div>'
    +'<div class="g2">'
    +'<div class="card"><div style="font-weight:700;margin-bottom:12px">Prochaines réservations</div>'
    +(active.length===0
